name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so a key in any commit is caught
      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan repository
        run: gitleaks git --redact --verbose --config .gitleaks.toml

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # M10.3: high+ advisories block the merge. A new upstream advisory is
      # fixed by adding a patched-version override in root package.json
      # ("pnpm.overrides") — see the existing entries.
      - run: pnpm audit --prod --audit-level high

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      # Iron Law #3: no metric/money arithmetic in apps/web (M7.7).
      - run: pnpm check:client-math

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-typecheck-${{ github.sha }}
          restore-keys: turbo-typecheck-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  schema-checks:
    name: Schema checks (drift + RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Drift: drizzle TS schema must match committed migrations (M2.7).
      - run: pnpm db:check-drift
      # RLS assertion also runs inside Unit tests (schema-checks.test.ts);
      # this job exists so a schema-only failure is legible at a glance.
      - run: pnpm vitest run packages/schema/src/db/schema-checks.test.ts

  rls-harness:
    name: RLS harness (live policies)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway service container only — the harness applies migrations
      # and seeds fixture tenants; it must never point at a real database.
      RLS_HARNESS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Impersonated-user scenarios against the REAL migrations: tenant
      # isolation, tier lattice (A1), no client notification inserts (B1),
      # storage path scoping, kill-switch, definer EXECUTE revokes.
      - run: pnpm vitest run packages/schema/src/rls/rls-harness.test.ts

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-build-${{ github.sha }}
          restore-keys: turbo-build-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    env:
      # Dummy values: the middleware fails closed (treats auth errors as
      # signed-out), which is exactly the state the smoke test asserts.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The app imports workspace packages (@credexis/shared, …) that
      # resolve to their built dist/ — build them before the dev server runs.
      - run: pnpm exec turbo run build --filter='./packages/*'
      - run: pnpm --filter @credexis/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  eval:
    name: Eval (golden corpus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # M1.4 harness, armed for the REAL corpus (audit-fixes-1): runs the
      # mock extractor over corpus ground truth (real + synthetic) and
      # compares against eval-baseline.json — corpus/scorer/loader
      # regressions on the 13 real docs go red. Live vendor accuracy is
      # measured out-of-band (bake-offs; RUN_LIVE_VENDOR_TESTS).
      - run: pnpm eval

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

# Cost discipline (2026-07-29): the original 10-job matrix paid ~10×
# checkout+pnpm-install setup per push and exhausted the Actions minutes
# pool in one marathon day. Same commands, same gates — consolidated into
# 5 jobs so setup is paid 5×, with named steps keeping failures legible.
jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so a key in any commit is caught
      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan repository
        run: gitleaks git --redact --verbose --config .gitleaks.toml

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # M10.3: high+ advisories block the merge. Fix new upstream advisories
      # with a patched-version override in root package.json (pnpm.overrides).
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      # Iron Law #3: no metric/money arithmetic in apps/web (M7.7).
      - name: Client-math check
        run: pnpm check:client-math
      # Drift: drizzle TS schema must match committed migrations (M2.7).
      - name: Migration drift check
        run: pnpm db:check-drift
      - name: Schema checks (RLS assertion)
        run: pnpm vitest run packages/schema/src/db/schema-checks.test.ts

  core:
    name: Typecheck, build, tests & eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-core-${{ github.sha }}
          restore-keys: turbo-core-
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Unit tests
        run: pnpm test
      # M1.4 harness, armed for the REAL corpus (audit-fixes-1): mock
      # extractor over corpus ground truth vs eval-baseline.json — corpus/
      # scorer/loader regressions on the real docs go red. Live vendor
      # accuracy is measured out-of-band (bake-offs; RUN_LIVE_VENDOR_TESTS).
      - name: Eval (golden corpus)
        run: pnpm eval

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    env:
      # Dummy values: the middleware fails closed (treats auth errors as
      # signed-out), which is exactly the state the smoke test asserts.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The app imports workspace packages (@credexis/shared, …) that
      # resolve to their built dist/ — build them before the dev server runs.
      - run: pnpm exec turbo run build --filter='./packages/*'
      - run: pnpm --filter @credexis/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  rls-harness:
    name: RLS harness (live policies)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway service container only — the harness applies migrations
      # and seeds fixture tenants; it must never point at a real database.
      RLS_HARNESS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Impersonated-user scenarios against the REAL migrations: tenant
      # isolation, tier lattice (A1), no client notification inserts (B1),
      # storage path scoping, kill-switch, definer EXECUTE revokes.
      - run: pnpm vitest run packages/schema/src/rls/rls-harness.test.ts
